<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmYARN — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Nunito', sans-serif; background: #f3e4c0; margin: 0; padding: 24px; color: #4a3521; }
  h1 { font-family: 'Baloo 2', cursive; color: #5e3b1f; }
  .card { background: #fff6e3; border: 3px solid #8a5a34; border-radius: 14px; padding: 16px; margin-bottom: 20px; max-width: 900px; }
  input, button { font-family: inherit; font-size: 14px; padding: 8px; border-radius: 8px; border: 2px solid #ccc; }
  button { background: #4f8f2e; color: #fff; border: none; cursor: pointer; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e0d0a8; font-size: 13px; }
  .stat-row { display: flex; gap: 20px; }
  .stat-box { background: #fff; border-radius: 10px; padding: 10px 16px; border: 2px solid #8a5a34; }
  .row-actions button { margin-right: 4px; font-size: 11px; padding: 4px 8px; }
  #login-box { max-width: 400px; }
  #login-box input { display: block; width: 100%; margin-bottom: 8px; box-sizing: border-box; }
</style>
</head>
<body>
<h1>🌾 FarmYARN — Admin Panel</h1>

<div class="card" id="login-box">
  <p>Log in with an admin account.</p>
  <input id="admin-username" placeholder="Username">
  <input id="admin-password" placeholder="Password" type="password">
  <button id="admin-login-btn">Log in</button>
  <p id="admin-login-error" style="color:#c4552e;font-weight:700;"></p>
</div>

<div id="admin-app" style="display:none;">
  <div class="card">
    <div class="stat-row" id="stats"></div>
  </div>

  <div class="card">
    <input id="search-input" placeholder="Search username...">
    <button id="search-btn">Search</button>
    <table id="players-table">
      <thead><tr><th>ID</th><th>Username</th><th>Lvl</th><th>Coins</th><th>Premium Points</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
let TOKEN = localStorage.getItem('fy_admin_token');

async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.error) || 'Request failed');
  return data;
}

document.getElementById('admin-login-btn').addEventListener('click', async () => {
  try {
    const username = document.getElementById('admin-username').value;
    const password = document.getElementById('admin-password').value;
    const { token, user } = await api('POST', '/api/auth/login', { username, password });
    if (!user.isAdmin) throw new Error('This account is not an admin.');
    TOKEN = token;
    localStorage.setItem('fy_admin_token', token);
    showApp();
  } catch (err) {
    document.getElementById('admin-login-error').textContent = err.message;
  }
});

async function showApp() {
  document.getElementById('login-box').style.display = 'none';
  document.getElementById('admin-app').style.display = 'block';
  await loadStats();
  await loadPlayers();
}

async function loadStats() {
  const s = await api('GET', '/api/admin/stats');
  document.getElementById('stats').innerHTML = `
    <div class="stat-box"><b>${s.totalUsers}</b><br>Players</div>
    <div class="stat-box"><b>${s.totalFarms}</b><br>Farms</div>
    <div class="stat-box"><b>${s.totalCrops}</b><br>Growing crops</div>
    <div class="stat-box"><b>${s.activeToday}</b><br>Active today</div>
  `;
}

function statusLabel(u) {
  if (u.is_banned) return '<b style="color:#c0392b">Banned</b>';
  if (u.suspended_until && u.suspended_until * 1000 > Date.now()) {
    return '<b style="color:#c98a12">Suspended<br>until ' + new Date(u.suspended_until * 1000).toLocaleDateString() + '</b>';
  }
  return 'OK';
}

async function loadPlayers(q) {
  const rows = await api('GET', '/api/admin/players' + (q ? '?q=' + encodeURIComponent(q) : ''));
  const tbody = document.querySelector('#players-table tbody');
  tbody.innerHTML = rows.map(u => `
    <tr>
      <td>${u.id}</td><td>${u.username}</td><td>${u.level}</td>
      <td>
        <input type="number" class="coins-input" data-coins-for="${u.id}" value="${u.coins}" style="width:80px">
        <button data-set-coins="${u.id}">Set</button>
      </td>
      <td>
        <input type="number" class="pp-amount" data-pp-for="${u.id}" value="100" style="width:60px" title="Premium Points to add">
        <button data-give-pp="${u.id}">Give PP</button>
      </td>
      <td>${statusLabel(u)}</td>
      <td class="row-actions">
        <button data-ban="${u.id}" data-state="${u.is_banned ? 0 : 1}">${u.is_banned ? 'Unban' : 'Ban'}</button>
        <input type="number" class="suspend-days" data-suspend-for="${u.id}" value="3" style="width:50px" title="Days">
        <button data-suspend="${u.id}">Suspend</button>
        ${u.suspended_until ? `<button data-unsuspend="${u.id}">Lift</button>` : ''}
        <button data-delete="${u.id}" data-username="${u.username}" style="background:#c0392b">Delete</button>
      </td>
    </tr>`).join('');

  tbody.querySelectorAll('button[data-set-coins]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const input = document.querySelector(`input[data-coins-for="${btn.dataset.setCoins}"]`);
      const coins = parseInt(input.value, 10);
      if (!Number.isFinite(coins) || coins < 0) return alert('Enter a valid coin amount.');
      await api('POST', `/api/admin/players/${btn.dataset.setCoins}/set-coins`, { coins });
      loadPlayers(document.getElementById('search-input').value);
    });
  });
  tbody.querySelectorAll('button[data-give-pp]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const input = document.querySelector(`input[data-pp-for="${btn.dataset.givePp}"]`);
      const amount = parseInt(input.value, 10) || 0;
      if (!amount) return;
      await api('POST', `/api/admin/players/${btn.dataset.givePp}/give-premium`, { amount });
      loadPlayers(document.getElementById('search-input').value);
    });
  });
  tbody.querySelectorAll('button[data-ban]').forEach(btn => {
    btn.addEventListener('click', async () => {
      await api('POST', `/api/admin/players/${btn.dataset.ban}/ban`, { banned: btn.dataset.state === '1' });
      loadPlayers(document.getElementById('search-input').value);
    });
  });
  tbody.querySelectorAll('button[data-suspend]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const input = document.querySelector(`input[data-suspend-for="${btn.dataset.suspend}"]`);
      const days = parseFloat(input.value) || 1;
      await api('POST', `/api/admin/players/${btn.dataset.suspend}/suspend`, { days });
      loadPlayers(document.getElementById('search-input').value);
    });
  });
  tbody.querySelectorAll('button[data-unsuspend]').forEach(btn => {
    btn.addEventListener('click', async () => {
      await api('POST', `/api/admin/players/${btn.dataset.unsuspend}/suspend`, { days: 0 });
      loadPlayers(document.getElementById('search-input').value);
    });
  });
  tbody.querySelectorAll('button[data-delete]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const name = btn.dataset.username;
      if (!confirm(`Permanently delete "${name}"? This deletes their farm, inventory, everything — it cannot be undone.`)) return;
      if (prompt(`Type "${name}" to confirm deletion:`) !== name) return alert('Name did not match — cancelled.');
      await api('DELETE', `/api/admin/players/${btn.dataset.delete}`);
      loadPlayers(document.getElementById('search-input').value);
    });
  });
}

document.getElementById('search-btn').addEventListener('click', () => loadPlayers(document.getElementById('search-input').value));

if (TOKEN) showApp().catch(() => { localStorage.removeItem('fy_admin_token'); });
</script>
</body>
</html>
