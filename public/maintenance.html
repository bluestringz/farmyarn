<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FarmYARN — Under Maintenance</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(180deg, #8fd0f2 0%, #cdeeb8 60%, #a9d98c 100%);
    display: flex; align-items: center; justify-content: center;
    color: #4a3521;
  }
  .wrap {
    max-width: 640px; width: 100%;
    margin: 24px;
    text-align: center;
  }
  img.banner {
    width: 100%; height: auto;
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    border: 4px solid #fff6e3;
  }
  .refresh-hint {
    margin-top: 18px;
    font-size: 14px;
    color: #3e5a2a;
    font-weight: 700;
  }
  .refresh-btn {
    margin-top: 10px;
    display: inline-block;
    font-family: 'Baloo 2', cursive;
    font-size: 16px;
    background: #4f8f2e;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 22px;
    cursor: pointer;
    font-weight: 700;
  }
  .refresh-btn:hover { background: #3f7524; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="banner" src="/assets/branding/maintenance-banner.png" alt="FarmYARN is under maintenance">
    <p class="refresh-hint">Just refresh this page every once in a while — we'll be back shortly!</p>
    <button class="refresh-btn" onclick="window.location.reload()">🔄 Refresh</button>
  </div>
</body>
</html>
